# Gradle JVM / parallelism
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod metadata (shared across all modern MC versions)
mod_version=0.1.0
maven_group=io.github.opencubicchunks
archives_base_name=cubicchunks

# Shared build-tool versions (same across all modern MC versions)
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
arch_loom_version=1.13-SNAPSHOT
neoforge_gradle_version=2.0.141

# MC-version-specific properties live in each version's gradle.properties
# e.g. 26.2/fabric/gradle.properties
#
# NOTE: the legacy 1.12.2 Forge module (1.12.2/forge) is a SEPARATE, standalone
# ForgeGradle 6 build with its own Gradle 8.2 wrapper. It is not part of this
# root Gradle invocation. Build it with:  cd 1.12.2/forge && ./gradlew build
