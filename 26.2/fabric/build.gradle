// MC 26.2 — Fabric, unobfuscated (no remapping), Java 25
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}"

base {
    archivesName = "${archives_base_name}-fabric"
}

repositories {
    mavenLocal()
}

loom {
    noIntermediateMappings()
    // No mixins yet. Loom 1.17 disables the mixin AP by default; when the first
    // real mixin is added, configure the modern mixin setup here (or set
    // useLegacyMixinAp = true with a defaultRefmapName if the legacy AP is needed).
}

sourceSets {
    main {
        java {
            srcDirs += [
                project(':common').file('src/main/java'),
                project(':fabric').file('src/main/java')
            ]
        }
        resources {
            srcDirs += [
                project(':common').file('src/main/resources'),
                project(':fabric').file('src/main/resources')
            ]
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release  = 25
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // MC 26.2 is unobfuscated — use implementation, not modImplementation
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // JSR-305 (javax.annotation.*) used by the ported CubicChunks API sources.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-fabric"
            from components.java
        }
    }
}
