// MC 26.2 — Fabric, unobfuscated (no remapping), Java 25
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}"

base {
    archivesName = "${archives_base_name}-fabric"
}

repositories {
    mavenLocal()
}

loom {
    noIntermediateMappings()

    // Pass -Ppopulation to a run task to enable cubic population in-game
    // (adds -Dcubicchunks.population=true to the game JVM). Off otherwise.
    //
    // A hard heap cap is always applied so a memory blow-up surfaces as a logged
    // OutOfMemoryError (with a heap dump) instead of exhausting system RAM and
    // taking the machine down. Raise it only if you know the run needs more.
    runs {
        client {
            vmArg '-Xmx4G'
            vmArg '-XX:+HeapDumpOnOutOfMemoryError'
            if (project.hasProperty('population')) {
                property 'cubicchunks.population', 'true'
            }
        }
        server {
            vmArg '-Xmx4G'
            vmArg '-XX:+HeapDumpOnOutOfMemoryError'
            if (project.hasProperty('population')) {
                property 'cubicchunks.population', 'true'
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs += [
                project(':common').file('src/main/java'),
                project(':fabric').file('src/main/java')
            ]
        }
        resources {
            srcDirs += [
                project(':common').file('src/main/resources'),
                project(':fabric').file('src/main/resources')
            ]
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release  = 25
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // MC 26.2 is unobfuscated — use implementation, not modImplementation
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // JSR-305 (javax.annotation.*) used by the ported CubicChunks API sources.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-fabric"
            from components.java
        }
    }
}
