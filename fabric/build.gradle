plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

// Source-only container for Fabric-specific code (entry points, events, compat).
// Version builds compile this via:  srcDirs += project(':fabric').file('src/main/java')
// Version-specific metadata (fabric.mod.json) lives in each MC version's directory.
compileJava.enabled = false
jar.enabled = false
tasks.matching { it.name == 'remapJar' }.configureEach { enabled = false }

// Source-only container: it is never launched. Runnable tasks live on the version modules
// (e.g. :mc26_2-fabric:runClient), which set the correct Java toolchain. Disabling these here
// prevents accidentally running the container with the wrong JVM.
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach { enabled = false }

loom {
    noIntermediateMappings()
}

// Loom is applied here ONLY to give IDEs a Minecraft + Fabric API classpath for
// code insight in fabric/src. Pinned to 26.2 (unobfuscated). Actual compilation
// always happens in the version projects via srcDirs +=, against each version's
// own Minecraft + mappings.
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation 'net.fabricmc.fabric-api:fabric-api:0.158.0+26.2'
}
